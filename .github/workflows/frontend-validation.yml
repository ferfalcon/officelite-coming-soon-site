name: Frontend Validation

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Generate dependency lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Generate P01-T01 lockfile [skip ci]"
            git push
          fi

      - name: Run Astro diagnostics
        run: pnpm check

      - name: Build static site
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run foundation browser validation
        run: pnpm test:e2e
