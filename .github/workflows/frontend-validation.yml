name: Frontend Validation

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Generate dependency lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: p01-t01-pnpm-lock
          path: frontend/pnpm-lock.yaml
          if-no-files-found: error

      - name: Run Astro diagnostics
        run: pnpm check

      - name: Build static site
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run foundation browser validation
        run: pnpm test:e2e
